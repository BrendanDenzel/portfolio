        /* ── SYSTEM DARK MODE ── */
    :root {
      --accent:       #4fa8d8;
      --accent-dim:   rgba(79,168,216,.13);
      --radius:       11px;
      --transition:   .2s ease;

      --bg-subtle:    #f4f7fb;
      --border:       #e2e8f0;
      --text:         #111827;
      --text-muted:   #6b7280;
      --heading:      #0f172a;
      --nav-bg:       #111111;
      --shadow:       0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:           #111111;
        --bg-subtle:    #1c1c1c;
        --border:       #2e2e2e;
        --text:         #e2e8f0;
        --text-muted:   #8899b0;
        --heading:      #f0f4f8;
        --shadow:       0 1px 4px rgba(0,0,0,.35), 0 6px 24px rgba(0,0,0,.28);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.72;
      transition: background var(--transition), color var(--transition);
    }
    a { color: inherit; text-decoration: none; }

    /* scroll progress */
    #progress {
      position: fixed; top: 0; left: 0; height: 3px;
      background: var(--accent); width: 0%; z-index: 300;
      transition: width .1s linear;
    }

    /* ════ NAV ════ */
    nav {
      background: var(--nav-bg);
      position: sticky; top: 0; z-index: 200;
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto;
      padding: 0 28px; height: 68px;
      display: flex; align-items: center; gap: 16px;
    }

    .nav-brand { display: flex; align-items: center; gap: 6px; }
    .nav-logo-light { display: block; }
    .nav-logo-dark  { display: none;  }
    @media (prefers-color-scheme: dark) {
      .nav-logo-light { display: none;  }
      .nav-logo-dark  { display: block; }
    }
    .nav-logo-light img,
    .nav-logo-dark  img { height: 36px; width: auto; display: block; }

    .nav-wordmark {
      font-family: 'Signika', sans-serif;
      font-size: 1.2rem; font-weight: 700;
      color: #fff; letter-spacing: .04em; white-space: nowrap;
    }

    .nav-links {
      display: flex; align-items: center; gap: 2px;
      list-style: none; margin-left: 20px;
    }
    .nav-links a {
      font-family: 'Signika', sans-serif;
      font-size: .87rem; font-weight: 600; letter-spacing: .04em;
      color: rgba(255,255,255,.72);
      padding: 6px 12px; border-radius: 6px;
      position: relative;
      transition: color var(--transition);
    }
    .nav-links a::after {
      content: ''; position: absolute;
      left: 12px; right: 12px; bottom: 3px;
      height: 1.5px; background: #fff;
      transform: scaleX(0); transform-origin: left;
      transition: transform .35s ease;
    }
    .nav-links a:hover { color: #fff; }
    .nav-links a:hover::after { transform: scaleX(1); }

    .nav-right {
      display: flex; align-items: center; gap: 12px; margin-left: auto;
    }
    .nav-insta {
      color: rgba(255,255,255,.7); display: flex; align-items: center;
      padding: 6px; border-radius: 6px; transition: color var(--transition);
    }
    .nav-insta:hover { color: #fff; }
    .nav-insta svg { width: 19px; height: 19px; }

    .btn-book {
      font-family: 'Signika', sans-serif;
      font-size: .85rem; font-weight: 700; letter-spacing: .05em;
      background: #fff; color: #111;
      padding: 7px 18px; border-radius: 7px; white-space: nowrap;
      transition: background var(--transition);
    }
    .btn-book:hover { background: #e2e8f0; }

    /* hamburger */
    .hamburger {
      display: none; flex-direction: column; justify-content: center;
      gap: 5px; width: 30px; height: 30px;
      background: none; border: none; cursor: pointer; padding: 2px;
    }
    .hamburger span {
      display: block; width: 22px; height: 2px;
      background: #fff; border-radius: 2px;
      transition: transform .35s ease, opacity .25s ease;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* mobile drawer */
    .mobile-menu {
      display: none;
      background: #1a1a1a;
      border-top: 1px solid rgba(255,255,255,.07);
      max-height: 0; overflow: hidden;

    .mobile-menu li a {

    @media (max-width: 768px) {

  <script>
  // scroll progress
  window.addEventListener('scroll', () => {
    const d = document.documentElement;
    document.getElementById('progress').style.width =
      (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%';
  });

  // hamburger toggle
  const ham  = document.getElementById('hamburger');
  const menu = document.getElementById('mobileMenu');
  ham.addEventListener('click', () => {
    const open = menu.classList.toggle('open');
    ham.classList.toggle('open', open);
    ham.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', e => {
    if (!ham.contains(e.target) && !menu.contains(e.target)) {
      menu.classList.remove('open');
      ham.classList.remove('open');
      ham.setAttribute('aria-expanded', 'false');
    }
  });
</script>
