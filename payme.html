<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dizz Studios — Pay Me</title>
  <meta name="description" content="Pay Dizz Studios for your session via Venmo, Cash App, or PayPal.">
  <link rel="icon" type="image/x-icon" href="dist/assets/favicon.ico" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Signika:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: { extend: { fontFamily: { 'signika': ['Signika', 'sans-serif'] } } },
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    .tap-highlight-transparent { -webkit-tap-highlight-color: transparent; }

    :root {
      --bg:       #ffffff;
      --bg2:      #f3f4f6;
      --border:   #e5e7eb;
      --text:     #111827;
      --dim:      #6b7280;
      --dimmer:   #9ca3af;
      --venmo:    #008CFF;
      --cashapp:  #00D632;
      --paypal-l: #009CDE;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:     #000000;
        --bg2:    #111111;
        --border: #222222;
        --text:   #ffffff;
        --dim:    #888888;
        --dimmer: #444444;
      }
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Signika', sans-serif;
      min-height: 100vh;
    }

    /* FIX: was display:flex which pushed content down and centered vertically */
    body {
      display: block;
      padding: 0 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.2;
    }
    @media (prefers-color-scheme: dark) { body::before { opacity: 0.4; } }

    /* WRAP: normal centered block, not vertically centered */
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding-top: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-block {
      text-align: center;
      margin-bottom: 28px;
      animation: fadeDown 0.7s ease both;
    }
    .logo-wordmark {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 64px;
      letter-spacing: 6px;
      color: var(--text);
      line-height: 1;
      display: block;
    }
    .logo-sub {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.3em;
      color: var(--dim);
      text-transform: uppercase;
      margin-top: 4px;
    }
    .logo-rule { display: flex; align-items: center; gap: 10px; margin: 14px auto 0; width: 160px; }
    .logo-rule-line { flex: 1; height: 1px; background: var(--dimmer); }
    .logo-rule-dot  { width: 4px; height: 4px; border-radius: 50%; background: var(--dim); }

    .tagline {
      font-size: 13px;
      font-weight: 300;
      color: var(--dim);
      letter-spacing: 0.08em;
      text-align: center;
      margin-bottom: 28px;
      animation: fadeDown 0.7s 0.1s ease both;
    }

    .payment-stack { width: 100%; display: flex; flex-direction: column; gap: 12px; }

    .pay-btn {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 22px 28px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg2);
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .pay-btn::before {
      content: ''; position: absolute; inset: 0;
      opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
    }
    .pay-btn:hover { transform: translateY(-3px); }

    .pay-btn.venmo   { animation: fadeUp 0.6s 0.2s ease both; }
    .pay-btn.venmo::before   { background: linear-gradient(135deg, rgba(0,140,255,0.08), transparent); }
    .pay-btn.venmo:hover     { border-color: var(--venmo);    box-shadow: 0 8px 32px rgba(0,140,255,0.15); }
    .pay-btn.venmo:hover::before   { opacity: 1; }

    .pay-btn.cashapp { animation: fadeUp 0.6s 0.3s ease both; }
    .pay-btn.cashapp::before { background: linear-gradient(135deg, rgba(0,214,50,0.08), transparent); }
    .pay-btn.cashapp:hover   { border-color: var(--cashapp);  box-shadow: 0 8px 32px rgba(0,214,50,0.15); }
    .pay-btn.cashapp:hover::before { opacity: 1; }

    .pay-btn.paypal  { animation: fadeUp 0.6s 0.4s ease both; }
    .pay-btn.paypal::before  { background: linear-gradient(135deg, rgba(0,156,222,0.08), transparent); }
    .pay-btn.paypal:hover    { border-color: var(--paypal-l); box-shadow: 0 8px 32px rgba(0,156,222,0.15); }
    .pay-btn.paypal:hover::before  { opacity: 1; }

    .pay-icon {
      width: 48px; height: 48px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .venmo   .pay-icon { background: rgba(0,140,255,0.12); }
    .cashapp .pay-icon { background: rgba(0,214,50,0.12); }
    .paypal  .pay-icon { background: rgba(0,156,222,0.12); }

    .pay-info { flex: 1; }
    .pay-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px; letter-spacing: 2px; line-height: 1; margin-bottom: 4px;
    }
    .venmo   .pay-name { color: var(--venmo); }
    .cashapp .pay-name { color: var(--cashapp); }
    .paypal  .pay-name { color: var(--paypal-l); }

    .pay-handle { font-size: 13px; font-weight: 300; color: var(--dim); letter-spacing: 0.03em; }

    .pay-arrow {
      font-size: 18px; color: var(--dimmer);
      transition: color 0.2s, transform 0.2s; flex-shrink: 0;
    }
    .pay-btn:hover .pay-arrow { color: var(--text); transform: translateX(4px); }

    .bottom-note { margin-top: 40px; text-align: center; animation: fadeUp 0.6s 0.6s ease both; }
    .bottom-note-text {
      font-size: 11px; font-weight: 300; color: var(--dimmer);
      letter-spacing: 0.1em; text-transform: uppercase;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .icon-venmo, .icon-cashapp, .icon-paypal { width: 28px; height: 28px; }

    /* light mode subtle card shadow */
    @media (prefers-color-scheme: light) {
      .pay-btn { box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    }
  </style>
</head>
